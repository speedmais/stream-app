events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name localhost;

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            alias /usr/local/nginx/html/stat.xsl;
        }

        location / {
            root /usr/local/nginx/html;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record all;
            record_path /tmp/rtmp/recordings;
            record_notify on;
            
            exec_publish /usr/local/nginx/conf/notify.sh $name;
            
            # HLS output
            hls on;
            hls_path /tmp/rtmp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
        }
    }
}
